# ============================================================
# sleep-consolidator —— 夜间记忆整理专用 preset
# ------------------------------------------------------------
# 用法：由 scripts/install-sleep-preset.ps1 插入到
#   %USERPROFILE%\.dsh\profiles\desktop\cordis.patch.yml 后重启 DSH。
#
# 边界：
#   · 只注册 read / glob / grep（读 memories/ 下的文件）
#   · **不注册** pwsh / write / edit / subagent —— 没有 shell、改不了文件
#   · MCP 记忆工具（memory_*）来自全局层，不需要这里注册
#   · 不挂 qq-tool-restrict：那个插件会把 MCP 记忆工具一起隐藏掉
# 人格不在这里写：由 workspace 的 AGENTS.md 提供（与主会话一致）。
# ============================================================
- insert:
    - id: preset-sleep-consolidator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sleep-consolidator
        name: 夜间整理
        description: 夜间记忆整理专用的只读 Agent：读当日与相关长期记忆，用 MCP 记忆工具写回。
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你在做一次「睡眠整理」，不是陪聊。任务是：把这一天里零散的对话与事件，整理成值得长期保留的记忆。

                纪律：
                - 只产出事实：承诺、偏好、决定、关于主人的事实、对他人的印象、已经发生的事。
                - 不产出：提问、请求、寒暄、工具输出、日志、链接、你自己的猜测。
                - 每条记忆要能独立读懂；原文没有的信息一个字都不要加。
                - 写入前先查重：与已有长期记忆重复的，用 memory_write 的 supersedes 替代旧的，不要并存。
                - audience 由你判断，但有一条不可越过的边界：
                  · 来源是主人私聊（qq:owner）或他人私聊（qq:private:*）里的具体对话内容——原话、承诺、亲密互动、身体与偏好细节——audience **绝不能**包含 qq:group:* 或 shared，privacy 至少标 personal。
                  · 涉及第三人具体言行的，audience 必须包含来源场景，且**只**包含来源场景。
                  · 真正能跨场景的，只有与具体对话无关的事实性结论（例如「出图能力已上线，群聊只出 SFW」）。写这种条目时不要引用任何原话；拿不准就只写来源场景。
                  · 关于主人自己、且不涉及私聊对话的，写 main。
                - privacy：私聊里的关系、身体、偏好细节标 personal 或 sensitive；普通事实才用 normal。标错一级就是把私密内容放到了别人的可见范围里。
                - 每条写 reason（为什么值得记），便于事后复查。
                - 写不出的、拿不准的，宁可不写。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
